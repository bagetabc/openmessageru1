name: Validate local admin prototype

on:
  push:
    branches: [main, telegram-local-admin]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile local-admin/server.py
      - name: Check required files
        run: |
          test -s local-admin/server.py
          test -s local-admin/index.html
          grep -q "127.0.0.1" local-admin/server.py
          grep -q "TEST-888" local-admin/server.py
